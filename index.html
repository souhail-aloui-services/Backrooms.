<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>BACKROOMS — SOUHAIL ALAOUI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Tahoma, sans-serif;
    }

    button {
      font-family: inherit;
      user-select: none;
      cursor: pointer;
    }

    /* شاشة البداية */

    #startScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 18px;
      padding: 0 20px 45px;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.25) 45%,
          rgba(0, 0, 0, 0.9)
        ),
        url("backrooms-menu.png") center center / cover no-repeat;
      z-index: 100;
    }

    #startScreen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
      opacity: 0.35;
    }

    .menuContent {
      position: relative;
      z-index: 2;
      width: min(900px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gameTitle {
      margin-bottom: 22px;
      color: #ffd000;
      font-size: clamp(34px, 6vw, 82px);
      font-weight: 900;
      letter-spacing: 5px;
      text-align: center;
      text-shadow:
        0 0 8px #ffd000,
        0 0 25px rgba(255, 208, 0, 0.7),
        4px 4px 0 #261b00;
    }

    .developerName {
      margin-top: -15px;
      margin-bottom: 28px;
      color: #ffe36b;
      font-size: clamp(13px, 2vw, 25px);
      letter-spacing: 5px;
      text-align: center;
      text-shadow: 0 0 10px #000;
    }

    .menuButton {
      position: relative;
      min-width: 300px;
      max-width: 100%;
      padding: 17px 42px;
      border: 2px solid #ffd000;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffd000;
      font-size: clamp(20px, 3vw, 30px);
      font-weight: bold;
      box-shadow:
        0 0 10px rgba(255, 208, 0, 0.6),
        inset 0 0 15px rgba(255, 208, 0, 0.12);
      transition: 0.2s ease;
    }

    .menuButton:hover,
    .menuButton:active {
      background: #ffd000;
      color: #000;
      transform: scale(1.04);
      box-shadow:
        0 0 25px #ffd000,
        inset 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .smallButtons {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .smallButton {
      min-width: 210px;
      padding: 13px 25px;
      border: 2px solid #ffd000;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.78);
      color: #ffd000;
      font-size: clamp(15px, 2vw, 22px);
      font-weight: bold;
      transition: 0.2s ease;
    }

    .smallButton:hover,
    .smallButton:active {
      background: #ffd000;
      color: #000;
    }

    /* اللعبة */

    #game {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #gameUI {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #gameTop {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .hudBox {
      padding: 12px 20px;
      border: 1px solid #ffd000;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffd000;
      font-size: 18px;
      font-weight: bold;
    }

    #backButton {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: auto;
      padding: 10px 18px;
      border: 1px solid #ffd000;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffd000;
      font-size: 16px;
    }

    #backButton:hover {
      background: #ffd000;
      color: #000;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90%, 500px);
      padding: 25px;
      border: 2px solid #ffd000;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffd000;
      text-align: center;
      font-size: 25px;
      line-height: 1.8;
    }

    /* النوافذ */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
    }

    .modalBox {
      width: min(500px, 100%);
      padding: 30px;
      border: 2px solid #ffd000;
      border-radius: 12px;
      background: #111;
      color: white;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 208, 0, 0.5);
    }

    .modalBox h2 {
      margin-bottom: 20px;
      color: #ffd000;
    }

    .modalBox p {
      line-height: 2;
      font-size: 17px;
    }

    .closeButton {
      margin-top: 25px;
      padding: 12px 30px;
      border: 1px solid #ffd000;
      border-radius: 8px;
      background: #ffd000;
      color: #000;
      font-weight: bold;
      font-size: 17px;
    }

    @media (max-width: 600px) {
      #startScreen {
        padding-bottom: 25px;
      }

      .gameTitle {
        letter-spacing: 2px;
      }

      .developerName {
        letter-spacing: 2px;
      }

      .menuButton {
        min-width: 250px;
        padding: 14px 25px;
      }

      .smallButtons {
        gap: 10px;
      }

      .smallButton {
        min-width: 0;
        width: 50%;
        padding: 12px 8px;
        font-size: 15px;
      }

      #gameTop {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .hudBox {
        padding: 8px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- شاشة البداية -->
  <section id="startScreen">
    <div class="menuContent">

      <h1 class="gameTitle">BACKROOMS</h1>

      <div class="developerName">
        SOUHAIL ALAOUI
      </div>

      <button class="menuButton" id="startButton">
        ابدأ اللعبة
      </button>

      <div class="smallButtons">
        <button class="smallButton" id="settingsButton">
          ⚙ الإعدادات
        </button>

        <button class="smallButton" id="howToPlayButton">
          📖 طريقة اللعب
        </button>
      </div>

    </div>
  </section>

  <!-- مكان اللعبة -->
  <main id="game">

    <canvas id="gameCanvas"></canvas>

    <div id="gameUI">
      <div id="gameTop">
        <div class="hudBox">
          الصحة: <span id="health">100</span>
        </div>

        <div class="hudBox">
          المستوى: 1
        </div>
      </div>

      <button id="backButton">
        رجوع للقائمة
      </button>

      <div id="message">
        اللعبة بدأت<br>
        ضع كود لعبة BACKROOMS الحقيقي هنا
      </div>
    </div>

  </main>

  <!-- نافذة الإعدادات -->
  <div class="modal" id="settingsModal">
    <div class="modalBox">
      <h2>الإعدادات</h2>
      <p>
        إعدادات اللعبة ستضاف هنا لاحقًا.
      </p>
      <button class="closeButton" data-close="settingsModal">
        إغلاق
      </button>
    </div>
  </div>

  <!-- نافذة طريقة اللعب -->
  <div class="modal" id="howToPlayModal">
    <div class="modalBox">
      <h2>طريقة اللعب</h2>
      <p>
        تحرك داخل الـ Backrooms.<br>
        ابحث عن البوابة البنفسجية.<br>
        تجنب الخطر وحاول النجاة.
      </p>
      <button class="closeButton" data-close="howToPlayModal">
        إغلاق
      </button>
    </div>
  </div>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const game = document.getElementById("game");
    const backButton = document.getElementById("backButton");

    const settingsButton = document.getElementById("settingsButton");
    const howToPlayButton = document.getElementById("howToPlayButton");

    const settingsModal = document.getElementById("settingsModal");
    const howToPlayModal = document.getElementById("howToPlayModal");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function drawGameBackground() {
      ctx.fillStyle = "#171717";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#302b12";
      ctx.fillRect(0, canvas.height * 0.65, canvas.width, canvas.height * 0.35);

      ctx.strokeStyle = "#62551d";
      ctx.lineWidth = 2;

      for (let x = 0; x < canvas.width; x += 80) {
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height * 0.5);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = canvas.height * 0.65; y < canvas.height; y += 35) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      ctx.fillStyle = "#ffd000";
      ctx.font = "bold 24px Arial";
      ctx.textAlign = "center";
      ctx.fillText(
        "BACKROOMS",
        canvas.width / 2,
        canvas.height / 2
      );
    }

    startButton.addEventListener("click", () => {
      startScreen.style.display = "none";
      game.style.display = "block";

      resizeCanvas();
      drawGameBackground();

      /*
        ضع كود اللعبة الحقيقي هنا.
        إذا كان عندك كود Three.js السابق،
        ضع محتواه داخل هذه الصفحة بدل هذا الجزء.
      */
    });

    backButton.addEventListener("click", () => {
      game.style.display = "none";
      startScreen.style.display = "flex";
    });

    settingsButton.addEventListener("click", () => {
      settingsModal.style.display = "flex";
    });

    howToPlayButton.addEventListener("click", () => {
      howToPlayModal.style.display = "flex";
    });

    document.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", () => {
        const modalId = button.getAttribute("data-close");
        document.getElementById(modalId).style.display = "none";
      });
    });

    window.addEventListener("resize", () => {
      if (game.style.display === "block") {
        resizeCanvas();
        drawGameBackground();
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>BACKROOMS — SOUHAIL ALAOUI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================
       شاشة البداية
    ========================= */

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 0 5% 7%;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.18) 50%,
          rgba(0, 0, 0, 0.88) 100%
        ),
        url("backrooms-menu.png") center center / cover no-repeat;
    }

    #startScreen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.025) 0,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );

      opacity: 0.35;
    }

    .menuContent {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 1400px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       الأزرار
    ========================= */

    .menuButton {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 15px;

      border: 3px solid #ffd000;
      color: #ffd000;
      background: rgba(0, 0, 0, 0.84);

      font-weight: bold;
      text-align: center;

      clip-path: polygon(
        15px 0,
        calc(100% - 15px) 0,
        100% 15px,
        100% calc(100% - 15px),
        calc(100% - 15px) 100%,
        15px 100%,
        0 calc(100% - 15px),
        0 15px
      );

      box-shadow:
        0 0 12px rgba(255, 208, 0, 0.5),
        inset 0 0 15px rgba(255, 208, 0, 0.12);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .menuButton::before {
      content: "";
      position: absolute;
      inset: 5px;

      border: 1px solid rgba(255, 208, 0, 0.35);
      pointer-events: none;

      clip-path: polygon(
        10px 0,
        calc(100% - 10px) 0,
        100% 10px,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        10px 100%,
        0 calc(100% - 10px),
        0 10px
      );
    }

    .menuButton:hover,
    .menuButton:active {
      background: #ffd000;
      color: #000;
      transform: scale(1.03);
    }

    /* =========================
       زر ابدأ اللعبة
    ========================= */

    #startButton {
      width: min(510px, 80%);
      min-height: 130px;

      padding: 20px 35px;

      font-size: clamp(30px, 4vw, 58px);

      box-shadow:
        0 0 18px rgba(255, 208, 0, 0.75),
        inset 0 0 25px rgba(255, 208, 0, 0.15);
    }

    /* =========================
       الأزرار السفلية
    ========================= */

    .smallButtons {
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      direction: ltr;

      margin-top: 18px;
      padding: 0 1%;
    }

    .smallButton {
      width: 285px;
      min-height: 88px;

      padding: 12px 20px;

      font-size: clamp(20px, 2.2vw, 32px);

      direction: rtl;
    }

    /* الإعدادات يسار */
    #settingsButton {
      order: 1;
    }

    /* طريقة اللعب يمين */
    #howToPlayButton {
      order: 2;
    }

    .buttonIcon {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 48px;
      height: 48px;

      font-size: 42px;
      line-height: 1;

      flex-shrink: 0;
    }

    #settingsButton .buttonIcon {
      font-size: 48px;
    }

    #howToPlayButton .buttonIcon {
      font-size: 43px;
    }

    /* =========================
       اللعبة
    ========================= */

    #game {
      display: none;

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      background: #111;
      color: white;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #gameUI {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #gameTop {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .hudBox {
      padding: 12px 20px;

      border: 1px solid #ffd000;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.7);
      color: #ffd000;

      font-size: 18px;
      font-weight: bold;
    }

    #backButton {
      position: absolute;
      top: 20px;
      right: 20px;

      pointer-events: auto;

      padding: 10px 18px;

      border: 1px solid #ffd000;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.75);
      color: #ffd000;

      font-size: 16px;
    }

    #backButton:hover {
      background: #ffd000;
      color: #000;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: min(90%, 500px);
      padding: 25px;

      border: 2px solid #ffd000;
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.85);
      color: #ffd000;

      text-align: center;
      font-size: 25px;
      line-height: 1.8;
    }

    /* =========================
       النوافذ
    ========================= */

    .modal {
      display: none;

      position: fixed;
      inset: 0;
      z-index: 200;

      align-items: center;
      justify-content: center;

      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
    }

    .modalBox {
      width: min(500px, 100%);
      padding: 30px;

      border: 2px solid #ffd000;
      border-radius: 12px;

      background: #111;
      color: white;
      text-align: center;

      box-shadow: 0 0 25px rgba(255, 208, 0, 0.5);
    }

    .modalBox h2 {
      margin-bottom: 20px;
      color: #ffd000;
    }

    .modalBox p {
      font-size: 17px;
      line-height: 2;
    }

    .closeButton {
      margin-top: 25px;
      padding: 12px 30px;

      border: 1px solid #ffd000;
      border-radius: 8px;

      background: #ffd000;
      color: #000;

      font-size: 17px;
      font-weight: bold;
    }

    /* =========================
       الهاتف عمودي
    ========================= */

    @media (max-width: 700px) and (orientation: portrait) {

      #startScreen {
        padding: 0 12px 22px;
      }

      #startButton {
        width: 90%;
        min-height: 75px;

        padding: 14px 20px;
        font-size: 27px;
      }

      .smallButtons {
        gap: 9px;
        margin-top: 12px;
        padding: 0;
      }

      .smallButton {
        width: 50%;
        min-height: 57px;

        padding: 8px 5px;

        gap: 6px;
        font-size: 15px;
      }

      .buttonIcon {
        width: 27px;
        height: 27px;
        font-size: 24px;
      }

      #settingsButton .buttonIcon {
        font-size: 28px;
      }

      #howToPlayButton .buttonIcon {
        font-size: 26px;
      }

      #gameTop {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .hudBox {
        padding: 8px 12px;
        font-size: 13px;
      }

      #backButton {
        top: 55px;
        right: 10px;

        padding: 8px 12px;
        font-size: 13px;
      }

      #message {
        padding: 20px;
        font-size: 20px;
      }
    }

    /* =========================
       الهاتف أفقي
       مهم: تصغير الأيقونات والأزرار
       عند قلب الهاتف
    ========================= */

    @media (max-width: 1000px) and (orientation: landscape) {

      #startScreen {
        padding:
          0
          20px
          10px;
      }

      .menuContent {
        width: 100%;
        max-width: 1000px;
      }

      /* زر ابدأ أصغر */
      #startButton {
        width: 48%;
        min-height: 58px;

        padding: 8px 18px;

        font-size: 24px;

        border-width: 2px;
      }

      /* الأزرار السفلية */
      .smallButtons {
        width: 100%;
        margin-top: 8px;
        padding: 0 2%;

        gap: 12px;
      }

      .smallButton {
        width: 31%;
        min-height: 47px;

        padding: 5px 12px;

        gap: 6px;

        border-width: 2px;

        font-size: 15px;
      }

      /* تصغير الأيقونات في الوضع الأفقي */

      .buttonIcon {
        width: 24px;
        height: 24px;

        font-size: 20px;
      }

      #settingsButton .buttonIcon {
        font-size: 22px;
      }

      #howToPlayButton .buttonIcon {
        font-size: 21px;
      }

      /* تصغير الحواف الداخلية */
      .menuButton::before {
        inset: 3px;
      }

      /* واجهة اللعبة */
      #gameTop {
        top: 8px;
        left: 10px;
        right: 10px;
      }

      .hudBox {
        padding: 6px 10px;
        font-size: 12px;
      }

      #backButton {
        top: 8px;
        right: 10px;

        padding: 6px 10px;
        font-size: 11px;
      }

      #message {
        width: min(75%, 400px);
        padding: 12px;

        font-size: 16px;
        line-height: 1.5;
      }

      .modalBox {
        width: min(75%, 450px);
        padding: 18px;
      }

      .modalBox h2 {
        margin-bottom: 10px;
        font-size: 20px;
      }

      .modalBox p {
        font-size: 14px;
        line-height: 1.6;
      }

      .closeButton {
        margin-top: 12px;
        padding: 8px 20px;
        font-size: 14px;
      }
    }

    /* =========================
       هاتف أفقي صغير جدًا
    ========================= */

    @media (max-height: 450px) and (orientation: landscape) {

      #startScreen {
        padding-bottom: 7px;
      }

      #startButton {
        min-height: 48px;
        width: 42%;

        padding: 6px 15px;

        font-size: 20px;
      }

      .smallButtons {
        margin-top: 6px;
        gap: 8px;
      }

      .smallButton {
        width: 29%;
        min-height: 38px;

        padding: 4px 8px;

        font-size: 12px;
      }

      .buttonIcon {
        width: 19px;
        height: 19px;

        font-size: 16px;
      }

      #settingsButton .buttonIcon {
        font-size: 18px;
      }

      #howToPlayButton .buttonIcon {
        font-size: 17px;
      }
    }

    /* أجهزة بشاشات قصيرة جدًا */
    @media (max-height: 360px) and (orientation: landscape) {

      #startButton {
        min-height: 40px;
        font-size: 17px;
      }

      .smallButton {
        min-height: 32px;
        font-size: 10px;
      }

      .buttonIcon {
        width: 15px;
        height: 15px;
        font-size: 13px;
      }

      #settingsButton .buttonIcon {
        font-size: 14px;
      }

      #howToPlayButton .buttonIcon {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- شاشة البداية -->
  <section id="startScreen">

    <div class="menuContent">

      <!-- زر ابدأ اللعبة -->
      <button id="startButton" class="menuButton">
        ابدأ اللعبة
      </button>

      <!-- الأزرار الجانبية -->
      <div class="smallButtons">

        <!-- اليسار -->
        <button id="settingsButton" class="menuButton smallButton">
          <span class="buttonIcon">⚙</span>
          <span>الإعدادات</span>
        </button>

        <!-- اليمين -->
        <button id="howToPlayButton" class="menuButton smallButton">
          <span class="buttonIcon">▣</span>
          <span>طريقة اللعب</span>
        </button>

      </div>

    </div>
  </section>

  <!-- اللعبة -->
  <main id="game">

    <canvas id="gameCanvas"></canvas>

    <div id="gameUI">

      <div id="gameTop">

        <div class="hudBox">
          الصحة:
          <span id="health">100</span>
        </div>

        <div class="hudBox">
          المستوى: 1
        </div>

      </div>

      <button id="backButton">
        رجوع للقائمة
      </button>

      <div id="message">
        اللعبة بدأت<br>
        ضع كود لعبة BACKROOMS الحقيقي هنا
      </div>

    </div>

  </main>

  <!-- نافذة الإعدادات -->
  <div class="modal" id="settingsModal">

    <div class="modalBox">

      <h2>الإعدادات</h2>

      <p>
        إعدادات اللعبة ستضاف هنا لاحقًا.
      </p>

      <button class="closeButton" data-close="settingsModal">
        إغلاق
      </button>

    </div>

  </div>

  <!-- نافذة طريقة اللعب -->
  <div class="modal" id="howToPlayModal">

    <div class="modalBox">

      <h2>طريقة اللعب</h2>

      <p>
        تحرك داخل الـ Backrooms.<br>
        ابحث عن البوابة البنفسجية.<br>
        تجنب الخطر وحاول النجاة.
      </p>

      <button class="closeButton" data-close="howToPlayModal">
        إغلاق
      </button>

    </div>

  </div>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const game = document.getElementById("game");
    const backButton = document.getElementById("backButton");

    const settingsButton =
      document.getElementById("settingsButton");

    const howToPlayButton =
      document.getElementById("howToPlayButton");

    const settingsModal =
      document.getElementById("settingsModal");

    const howToPlayModal =
      document.getElementById("howToPlayModal");

    const canvas =
      document.getElementById("gameCanvas");

    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function drawGameBackground() {

      ctx.fillStyle = "#171717";
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.fillStyle = "#302b12";

      ctx.fillRect(
        0,
        canvas.height * 0.65,
        canvas.width,
        canvas.height * 0.35
      );

      ctx.strokeStyle = "#62551d";
      ctx.lineWidth = 2;

      for (
        let x = 0;
        x < canvas.width;
        x += 80
      ) {

        ctx.beginPath();

        ctx.moveTo(
          canvas.width / 2,
          canvas.height * 0.5
        );

        ctx.lineTo(
          x,
          canvas.height
        );

        ctx.stroke();
      }

      for (
        let y = canvas.height * 0.65;
        y < canvas.height;
        y += 35
      ) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);

        ctx.stroke();
      }

      ctx.fillStyle = "#ffd000";
      ctx.font = "bold 24px Arial";
      ctx.textAlign = "center";

      ctx.fillText(
        "BACKROOMS",
        canvas.width / 2,
        canvas.height / 2
      );
    }

    /* بدء اللعبة */

    startButton.addEventListener(
      "click",
      () => {

        startScreen.style.display = "none";
        game.style.display = "block";

        resizeCanvas();
        drawGameBackground();

        /*
          ضع كود اللعبة الحقيقي هنا.
        */
      }
    );

    /* رجوع للقائمة */

    backButton.addEventListener(
      "click",
      () => {

        game.style.display = "none";
        startScreen.style.display = "flex";
      }
    );

    /* الإعدادات */

    settingsButton.addEventListener(
      "click",
      () => {

        settingsModal.style.display = "flex";
      }
    );

    /* طريقة اللعب */

    howToPlayButton.addEventListener(
      "click",
      () => {

        howToPlayModal.style.display = "flex";
      }
    );

    /* إغلاق النوافذ */

    document
      .querySelectorAll("[data-close]")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const modalId =
              button.getAttribute("data-close");

            document.getElementById(modalId)
              .style.display = "none";
          }
        );
      });

    /* تحديث الحجم */

    window.addEventListener(
      "resize",
      () => {

        if (game.style.display === "block") {

          resizeCanvas();
          drawGameBackground();
        }
      }
    );

    /* تغيير الاتجاه */

    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(() => {

          if (game.style.display === "block") {

            resizeCanvas();
            drawGameBackground();
          }

        }, 250);
      }
    );
  </script>

</body>
</html>

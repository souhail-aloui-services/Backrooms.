
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BACKROOMS — SOUHAIL ALAOUI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000 url("backrooms-menu.png") center center / cover no-repeat;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 7vh;
      z-index: 10;
    }

    #startButton {
      min-width: 280px;
      padding: 18px 45px;
      border: 3px solid #ffd000;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffd000;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow:
        0 0 15px #ffd000,
        inset 0 0 15px rgba(255, 208, 0, 0.25);
      transition: 0.2s;
    }

    #startButton:hover {
      background: #ffd000;
      color: #000;
      transform: scale(1.05);
    }

    #game {
      display: none;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #game h1 {
      color: #ffd000;
      font-size: 35px;
    }

    @media (max-width: 600px) {
      #startScreen {
        background-position: center center;
        padding-bottom: 5vh;
      }

      #startButton {
        min-width: 230px;
        padding: 15px 30px;
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- شاشة البداية -->
  <section id="startScreen">
    <button id="startButton">ابدأ اللعبة</button>
  </section>

  <!-- محتوى اللعبة -->
  <main id="game">
    <div>
      <h1>BACKROOMS</h1>
      <p>اللعبة بدأت...</p>
    </div>
  </main>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const game = document.getElementById("game");

    startButton.addEventListener("click", () => {
      startScreen.style.display = "none";
      game.style.display = "flex";

      // ضع كود اللعبة الحقيقي هنا
    });
  </script>

</body>
</html>

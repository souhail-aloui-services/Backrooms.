<style>

<section id="startScreen"><div id="logoWrap"><div id="logoTitle">BACKROOMS</div><div id="logoTag">لا نهاية لهذا المكان</div><div id="logoDev">&lt;SOUHAIL ALAOUI /&gt;</div></div><div class="menuContent"><button id="startButton" class="menuButton">ابدأ اللعبة</button><div class="smallButtons"><button id="settingsButton" class="menuButton smallButton">⚙ الإعدادات</button><button id="howToPlayButton" class="menuButton smallButton">▣ طريقة اللعب</button></div></div></section>

<div class="modal" id="settingsModal"><div class="modalBox"><h2>الإعدادات</h2><div class="settingRow"><label>جودة الرسوميات</label><select id="qualitySelect"><option value="low">منخفضة</option><option value="medium" selected>متوسطة</option><option value="high">عالية</option></select></div><div class="settingRow"><label>حساسية النظر</label><input type="range" id="sensRange" min="0.4" max="2.5" step="0.1" value="1"></div><div class="settingRow"><label>مستوى الصوت</label><input type="range" id="volRange" min="0" max="1" step="0.05" value="0.6"></div><div class="settingRow"><label><input type="checkbox" id="bobToggle" checked> حركة الرأس</label></div><div class="settingRow"><label><input type="checkbox" id="shakeToggle" checked> اهتزاز الكاميرا</label></div><button class="closeButton" data-close="settingsModal">حفظ وإغلاق</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const CONFIG={CELL:4,WALL_HEIGHT:4.2,PLAYER_RADIUS:.32,PLAYER_EYE_HEIGHT:1.62,CROUCH_EYE_HEIGHT:1.05,GRAVITY:9.81,WALK_SPEED:3.2,SPRINT_SPEED:5.8,CROUCH_SPEED:1.6,ACCELERATION:12,DECELERATION:15,MAX_RENDER_DISTANCE:70,FOV:75,NEAR_CLIP:.05,FAR_CLIP:250,GRID_W:19,GRID_H:19,HP_MAX:100,BATTERY_MAX:100,BATTERY_DRAIN:2.1,STAMINA_MAX:100,STAMINA_DRAIN:18,STAMINA_REGEN:12,PISTOL_MAG:12,PISTOL_RESERVE:48,PISTOL_RELOAD_TIME:1.5,PISTOL_FIRE_RATE:360,CEIL_CORRIDOR_MIN:3.3,CEIL_CORRIDOR_MAX:4.4,CEIL_ROOM_MIN:5.2,CEIL_ROOM_MAX:7.8,CEIL_RARE_MIN:8.6,CEIL_RARE_MAX:11.5,RARE_ROOM_CHANCE:.18,COLUMN_CHANCE:.10,SLANT_WALL_CHANCE:.06,DEBRIS_CHANCE:.05,DEADEND_DEBRIS_CHANCE:.55,LIGHT_FALLOFF_RANGE:24};
const state={running:false,paused:false,quality:"medium",sensitivity:1,volume:.6,headBob:true,camShake:true,yaw:0,pitch:0,posX:0,posZ:0,velX:0,velZ:0,crouching:false,crouchAmount:0,sprinting:false,moving:false,bobTimer:0,breatheTimer:0,distanceTravelled:0,hp:100,battery:100,stamina:100,flashlightOn:false,ammo:12,reserve:48,reloading:false,reloadTimer:0,fireCooldown:0,recoilPitch:0,recoilKick:0,targets:[],foundCount:0,visitedCells:new Set(),gameOver:false,win:false};
let scene,camera,renderer,clock,listener,wallMesh,grid=[],cellType=[],cellHeight=[],columns=[],startCell={r:1,c:1},gateCell=null,gateMesh=null,gateLight=null,ceilingLights=[],detective=null,raycaster=new THREE.Raycaster(),gunGroup=null,muzzleLight=null,muzzleFlash=null,deduceFlashTimer=0;
let playerModel=null,mixer=null,followerPos={x:0,z:0},followerTargetPos={x:0,z:0};
let audioCtx=null;
function initAudio(){audioCtx=new(window.AudioContext||window.webkitAudioContext)();listener=new THREE.AudioListener();camera.add(listener);}
function noiseBuffer(d,c){const sr=c.sampleRate;const b=c.createBuffer(1,sr*d,sr);const da=b.getChannelData(0);for(let i=0;i<da.length;i++)da[i]=(Math.random()*2-1)*Math.pow(1-i/da.length,1.4);return b;}
function playTone(f,d,t,g){if(!audioCtx)return;const o=audioCtx.createOscillator(),ga=audioCtx.createGain();o.type=t||"sine";o.frequency.value=f;ga.gain.value=(g!==undefined?g:.2)*state.volume;ga.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(ga).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}
function playNoise(d,g,f){if(!audioCtx)return;const s=audioCtx.createBufferSource();s.buffer=noiseBuffer(d,audioCtx);const fi=audioCtx.createBiquadFilter();fi.type="lowpass";fi.frequency.value=f||1200;const ga=audioCtx.createGain();ga.gain.value=(g!==undefined?g:.3)*state.volume;s.connect(fi).connect(ga).connect(audioCtx.destination);s.start();}
function playFootstep(){playNoise(.09,.18,900);}function playGunshot(){playNoise(.18,.6,2200);playTone(140,.12,"square",.25);}function playReload(){playTone(700,.05,"square",.15);setTimeout(()=>playTone(900,.05,"square",.15),140);}function playFlashClick(){playTone(500,.04,"square",.12);}function playDoorGate(){playTone(80,.9,"sine",.3);}
function playHum(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=60;g.gain.value=.03*state.volume;o.connect(g).connect(audioCtx.destination);o.start();return{o,g};}let hum=null;
function spatialGrowl(m){if(!audioCtx||!listener)return;const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.8,audioCtx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++){const t=i/audioCtx.sampleRate;d[i]=Math.sin(2*Math.PI*55*t+Math.sin(t*9)*3)*.6*(1-i/d.length);}const a=new THREE.PositionalAudio(listener);a.setBuffer(b);a.setRefDistance(4);a.setVolume(state.volume);m.add(a);a.play();setTimeout(()=>{if(m.children.includes(a))m.remove(a);},900);}
function generateMaze(){const W=CONFIG.GRID_W,H=CONFIG.GRID_H;grid=[];cellType=[];for(let r=0;r<H;r++){grid.push(new Array(W).fill(0));cellType.push(new Array(W).fill("wall"));}function carve(r,c){grid[r][c]=1;cellType[r][c]="corridor";const dirs=[[-2,0],[2,0],[0,-2],[0,2]];for(let i=dirs.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=dirs[i];dirs[i]=dirs[j];dirs[j]=t;}for(const d of dirs){const nr=r+d[0],nc=c+d[1];if(nr>0&&nr<H-1&&nc>0&&nc<W-1&&grid[nr][nc]===0){grid[r+d[0]/2][c+d[1]/2]=1;cellType[r+d[0]/2][c+d[1]/2]="corridor";carve(nr,nc);}}}carve(1,1);const floorCells=[];for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++)if(grid[r][c]===1)floorCells.push([r,c]);const roomBlobs=[];const numRooms=5+((Math.random()*3)|0);for(let i=0;i<numRooms;i++){const anchor=floorCells[(Math.random()*floorCells.length)|0];const size=1+((Math.random()*2)|0);const blob=[];for(let r=anchor[0]-size;r<=anchor[0]+size;r++){for(let c=anchor[1]-size;c<=anchor[1]+size;c++){if(r>0&&r<H-1&&c>0&&c<W-1&&Math.random()<.82){grid[r][c]=1;blob.push([r,c]);}}}roomBlobs.push(blob);}roomBlobs.forEach(blob=>{const rare=Math.random()<CONFIG.RARE_ROOM_CHANCE;for(const[rr,cc]of blob)cellType[rr][cc]=rare?"rare":"room";});computeCellHeights();}
function computeCellHeights(){const H=CONFIG.GRID_H,W=CONFIG.GRID_W;cellHeight=Array.from({length:H},()=>new Array(W).fill(CONFIG.WALL_HEIGHT));for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(grid[r][c]!==1)continue;const t=cellType[r][c];let h;if(t==="rare")h=CONFIG.CEIL_RARE_MIN+Math.random()*(CONFIG.CEIL_RARE_MAX-CONFIG.CEIL_RARE_MIN);else if(t==="room")h=CONFIG.CEIL_ROOM_MIN+Math.random()*(CONFIG.CEIL_ROOM_MAX-CONFIG.CEIL_ROOM_MIN);else h=CONFIG.CEIL_CORRIDOR_MIN+Math.random()*(CONFIG.CEIL_CORRIDOR_MAX-CONFIG.CEIL_CORRIDOR_MIN);cellHeight[r][c]=h;}}
function bfsDistances(sr,sc){const W=CONFIG.GRID_W,H=CONFIG.GRID_H;const dist=Array.from({length:H},()=>new Array(W).fill(-1));dist[sr][sc]=0;const q=[[sr,sc]];let head=0;while(head<q.length){const[rr,cc]=q[head++];const d=dist[rr][cc];const nbrs=[[rr-1,cc],[rr+1,cc],[rr,cc-1],[rr,cc+1]];for(const[nr,nc]of nbrs){if(nr>=0&&nr<H&&nc>=0&&nc<W&&grid[nr][nc]===1&&dist[nr][nc]===-1){dist[nr][nc]=d+1;q.push([nr,nc]);}}}return dist;}

function proceduralTexture(b,v,s,st){const size=256;const cnv=document.createElement("canvas");cnv.width=size;cnv.height=size;const ctx=cnv.getContext("2d");ctx.fillStyle=b;ctx.fillRect(0,0,size,size);for(let i=0;i<1400;i++){const shade=(Math.random()-.5)*v;ctx.fillStyle=`rgba(${shade>0?255:0},${shade>0?255:0},${shade>0?255:0},${Math.abs(shade)*.05})`;ctx.fillRect(Math.random()*size,Math.random()*size,2,2);}if(s){for(let i=0;i<10;i++){const x=Math.random()*size;ctx.strokeStyle=`rgba(0,0,0,${.03+Math.random()*.06})`;ctx.lineWidth=1+Math.random()*2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+(Math.random()*10-5),size);ctx.stroke();}}if(st){for(let i=0;i<6;i++){const x=Math.random()*size,y=Math.random()*size,r=10+Math.random()*30;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,"rgba(20,15,5,.18)");g.addColorStop(1,"rgba(20,15,5,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}}const tex=new THREE.CanvasTexture(cnv);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;return tex;}

function fireWeapon(){if(!state.running||state.paused||state.gameOver||state.win)return;if(state.reloading||state.fireCooldown>0||state.ammo<=0)return;state.ammo--;state.fireCooldown=CONFIG.PISTOL_FIRE_RATE/1000;state.recoilPitch+=.03;state.recoilKick=1;playGunshot();document.getElementById("ammoCount").textContent=state.ammo;muzzleFlash.material.opacity=1;muzzleLight.intensity=3;raycaster.set(camera.getWorldPosition(new THREE.Vector3()),camera.getWorldDirection(new THREE.Vector3()));raycaster.far=CONFIG.MAX_RENDER_DISTANCE;const targets=state.targets.filter(t=>!t.dead&&t.aiState!=="HIDDEN").map(t=>t.group);const hits=raycaster.intersectObjects(targets,true);if(hits.length){let g=hits[0].object;while(g.parent&&!state.targets.find(t=>t.group===g))g=g.parent;const target=state.targets.find(t=>t.group===g);if(target){target.aiState="CHASE";target.patrolTarget={x:state.posX,z:state.posZ};}}if(state.ammo===0)startReload();}
function startReload(){if(state.reloading||state.reserve<=0||state.ammo===CONFIG.PISTOL_MAG)return;state.reloading=true;state.reloadTimer=CONFIG.PISTOL_RELOAD_TIME;playReload();}
function updateWeapon(delta){if(state.fireCooldown>0)state.fireCooldown-=delta;state.recoilPitch=Math.max(0,state.recoilPitch-delta*.15);state.recoilKick=Math.max(0,state.recoilKick-delta*4);muzzleFlash.material.opacity=Math.max(0,muzzleFlash.material.opacity-delta*8);muzzleLight.intensity=Math.max(0,muzzleLight.intensity-delta*12);gunGroup.position.y=-.22+state.recoilKick*.03;gunGroup.position.z=-.5+state.recoilKick*.05;if(state.reloading){state.reloadTimer-=delta;if(state.reloadTimer<=0){const need=CONFIG.PISTOL_MAG-state.ammo;const take=Math.min(need,state.reserve);state.ammo+=take;state.reserve-=take;state.reloading=false;document.getElementById("ammoCount").textContent=state.ammo;document.getElementById("reserveCount").textContent=state.reserve;}}}
function deduce(){if(!state.running||state.paused)return;let nearest=null,nearestDist=Infinity;for(const t of state.targets){if(t.dead)continue;const d=Math.hypot(t.x-state.posX,t.z-state.posZ);if(d<nearestDist){nearestDist=d;nearest=t;}}const info=document.getElementById("deduceInfo");if(nearest&&nearestDist<15){if(!nearest.discovered){nearest.discovered=true;nearest.group.visible=true;if(nearest.aiState==="HIDDEN")nearest.aiState="IDLE";state.foundCount++;document.getElementById("foundCount").textContent=state.foundCount;}info.innerHTML=`<b>${nearest.name}</b><br>${nearest.info}<br><span style="color:#ff5a5a">خطر: ${nearest.danger}/5</span><br>الحالة: ${nearest.aiState}`;}else{info.textContent="لا يوجد شيء قريب بما يكفي للتحليل.";}info.style.display="block";deduceFlashTimer=4;}
function openDeathNote(){state.paused=true;document.getElementById("deathNoteModal").style.display="flex";const list=state.targets.filter(t=>t.discovered).map(t=>t.dead?`${t.name} (ميت)`:t.name).join(" — ")||"لا يوجد أهداف مكتشفة بعد";document.getElementById("deathNoteTargets").textContent="الأهداف المكتشفة: "+list;document.getElementById("deathNoteMsg").textContent="";document.getElementById("deathNoteMsg").className="";}
function submitDeathNote(){const val=document.getElementById("deathNoteInput").value.trim().toUpperCase();const msg=document.getElementById("deathNoteMsg");const target=state.targets.find(t=>t.name===val);if(!target||!target.discovered){msg.textContent="اسم غير معروف. يجب اكتشاف الهدف أولاً عبر التحليل.";msg.className="err";return;}if(target.dead){msg.textContent="هذا الهدف ميت بالفعل.";msg.className="err";return;}target.dead=true;target.aiState="DEAD";target.group.visible=false;msg.textContent="تم تسجيل الاسم. الهدف "+target.name+" لم يعد يشكل خطرًا.";msg.className="ok";document.getElementById("deathNoteInput").value="";}
const detectiveHints=["أشعر بوجود شيء يتحرك في الظلام.","الأصوات الغريبة تأتي من الممرات الضيقة.","استخدم زر التحليل عندما تشعر بشيء غير طبيعي.","دفتر الموت لا يعمل إلا مع الأسماء التي اكتشفتها."];
function interact(){if(!detective)return;const dx=detective.group.position.x-state.posX,dz=detective.group.position.z-state.posZ;if(Math.hypot(dx,dz)<3){let text=detectiveHints[(Math.random()*detectiveHints.length)|0];const box=document.getElementById("dialogueBox");box.innerHTML="<b>L-Detective:</b> "+text;box.style.display="block";clearTimeout(window._dlgTimer);window._dlgTimer=setTimeout(()=>box.style.display="none",4500);}}
const stateLabels={IDLE:"هادئ",PATROL:"دورية",INVESTIGATE:"يستكشف",CHASE:"مطاردة!",SEARCH:"يبحث",HIDDEN:"مخفي",DEAD:"ميت"};
function updateHUD(){document.getElementById("hpFill").style.width=Math.max(0,state.hp)+"%";document.getElementById("battFill").style.width=Math.max(0,state.battery)+"%";document.getElementById("stamFill").style.width=Math.max(0,state.stamina)+"%";let worst="IDLE",worstRank=-1;const rank={IDLE:0,PATROL:1,SEARCH:2,INVESTIGATE:3,CHASE:4};for(const t of state.targets){if(t.discovered&&!t.dead&&rank[t.aiState]>worstRank){worstRank=rank[t.aiState];worst=t.aiState;}}const label=document.getElementById("stateLabel");label.textContent=stateLabels[worst]||"هادئ";label.style.color=worst==="CHASE"?"#ff5050":"#ffd000";if(deduceFlashTimer>0){deduceFlashTimer-=1/60;if(deduceFlashTimer<=0)document.getElementById("deduceInfo").style.display="none";}const hint=document.getElementById("interactHint");if(detective){const dist=Math.hypot(detective.group.position.x-state.posX,detective.group.position.z-state.posZ);hint.style.display=dist<3?"block":"none";hint.textContent="اضغط E للتحدث مع L-Detective";}}
const mmCtx=document.getElementById("minimapCanvas").getContext("2d");
function drawMinimap(){const size=96;mmCtx.clearRect(0,0,size,size);mmCtx.fillStyle="rgba(0,0,0,.6)";mmCtx.fillRect(0,0,size,size);const scale=3.2,cx=size/2,cz=size/2;mmCtx.fillStyle="#5a4d1a";for(const key of state.visitedCells){const[r,c]=key.split(",").map(Number);const p=cellToWorld(r,c);const dx=(p.x-state.posX)*scale/CONFIG.CELL+cx,dz=(p.z-state.posZ)*scale/CONFIG.CELL+cz;if(dx>=0&&dx<=size&&dz>=0&&dz<=size)mmCtx.fillRect(dx-1.5,dz-1.5,3,3);}if(state.visitedCells.has(Math.round(gateCell.r)+","+Math.round(gateCell.c))){const p=cellToWorld(gateCell.r,gateCell.c);const dx=(p.x-state.posX)*scale/CONFIG.CELL+cx,dz=(p.z-state.posZ)*scale/CONFIG.CELL+cz;mmCtx.fillStyle="#b27bff";mmCtx.beginPath();mmCtx.arc(dx,dz,3,0,Math.PI*2);mmCtx.fill();}for(const t of state.targets){if(!t.discovered||t.dead)continue;const dx=(t.x-state.posX)*scale/CONFIG.CELL+cx,dz=(t.z-state.posZ)*scale/CONFIG.CELL+cz;if(dx>=0&&dx<=size&&dz>=0&&dz<=size){mmCtx.fillStyle=t.aiState==="CHASE"?"#ff3030":"#ff9d3b";mmCtx.beginPath();mmCtx.arc(dx,dz,2.4,0,Math.PI*2);mmCtx.fill();}}if(playerModel){const dx=(followerPos.x-state.posX)*scale/CONFIG.CELL+cx,dz=(followerPos.z-state.posZ)*scale/CONFIG.CELL+cz;mmCtx.fillStyle="#5aff8d";mmCtx.beginPath();mmCtx.arc(dx,dz,3,0,Math.PI*2);mmCtx.fill();}mmCtx.fillStyle="#ffd000";mmCtx.save();mmCtx.translate(cx,cz);mmCtx.rotate(state.yaw);mmCtx.beginPath();mmCtx.moveTo(0,-5);mmCtx.lineTo(4,5);mmCtx.lineTo(-4,5);mmCtx.closePath();mmCtx.fill();mmCtx.restore();}
function saveGame(){try{localStorage.setItem("backrooms_save",JSON.stringify({quality:state.quality,sensitivity:state.sensitivity,volume:state.volume,headBob:state.headBob,camShake:state.camShake}));}catch(e){}}
function loadSettings(){try{const raw=localStorage.getItem("backrooms_save");if(!raw)return;const d=JSON.parse(raw);state.quality=d.quality||"medium";state.sensitivity=d.sensitivity||1;state.volume=d.volume!==undefined?d.volume:.6;state.headBob=d.headBob!==undefined?d.headBob:true;state.camShake=d.camShake!==undefined?d.camShake:true;document.getElementById("qualitySelect").value=state.quality;document.getElementById("sensRange").value=state.sensitivity;document.getElementById("volRange").value=state.volume;document.getElementById("bobToggle").checked=state.headBob;document.getElementById("shakeToggle").checked=state.camShake;}catch(e){}}
function applyQuality(q){state.quality=q;if(!renderer)return;if(q==="low"){renderer.setPixelRatio(1);renderer.shadowMap.enabled=false;}else if(q==="medium"){renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.shadowMap.enabled=false;}else{renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;}}

function updateMovement(delta){
  let forward=0,side=0;
  if(keys.forward)forward++; if(keys.backward)forward--; if(keys.left)side--; if(keys.right)side++;
  state.moving=forward!==0||side!==0;
  const canSprint=state.moving&&state.sprinting&&state.stamina>0&&!state.crouching;
  const targetSpeed=state.crouching?CONFIG.CROUCH_SPEED:(canSprint?CONFIG.SPRINT_SPEED:CONFIG.WALK_SPEED);
  if(canSprint)state.stamina=Math.max(0,state.stamina-CONFIG.STAMINA_DRAIN*delta); else state.stamina=Math.min(CONFIG.STAMINA_MAX,state.stamina+CONFIG.STAMINA_REGEN*delta);
  const dirX=Math.sin(state.yaw),dirZ=Math.cos(state.yaw),rightX=Math.sin(state.yaw+Math.PI/2),rightZ=Math.cos(state.yaw+Math.PI/2);
  const wishX=(-dirX*forward+rightX*side),wishZ=(-dirZ*forward+rightZ*side),wishLen=Math.hypot(wishX,wishZ)||1;
  const targetVelX=(wishX/wishLen)*targetSpeed*(state.moving?1:0),targetVelZ=(wishZ/wishLen)*targetSpeed*(state.moving?1:0);
  const accel=state.moving?CONFIG.ACCELERATION:CONFIG.DECELERATION;
  state.velX+=(targetVelX-state.velX)*Math.min(1,accel*delta);state.velZ+=(targetVelZ-state.velZ)*Math.min(1,accel*delta);
  let nx=state.posX+state.velX*delta,nz=state.posZ+state.velZ*delta;
  const resolved=resolveCollision(nx,nz,CONFIG.PLAYER_RADIUS);
  state.posX=resolved.x;state.posZ=resolved.z;
  state.sprinting=state.sprinting&&canSprint;
  if(state.moving){state.bobTimer+=delta*(state.sprinting?9:state.crouching?4:6.2);if(!state._stepFlag&&Math.sin(state.bobTimer)>0.9){state._stepFlag=true;playFootstep();}if(Math.sin(state.bobTimer)<0)state._stepFlag=false;}
  state.crouchAmount+=( (state.crouching?1:0) - state.crouchAmount)*Math.min(1,10*delta);
  const r=Math.round(state.posZ/CONFIG.CELL+CONFIG.GRID_H/2),c=Math.round(state.posX/CONFIG.CELL+CONFIG.GRID_W/2);
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)state.visitedCells.add((r+dr)+","+(c+dc));
  const gd=Math.hypot(state.posX-cellToWorld(gateCell.r,gateCell.c).x,state.posZ-cellToWorld(gateCell.r,gateCell.c).z);if(gd<1.6&&!state.win&&!state.gameOver)triggerWin();

  if(playerModel){
    const behindDist=2.6;
    followerTargetPos.x=state.posX+Math.sin(state.yaw)*behindDist;
    followerTargetPos.z=state.posZ+Math.cos(state.yaw)*behindDist;
    const followSpeed=state.sprinting?4.8:2.9;
    followerPos.x+=(followerTargetPos.x-followerPos.x)*followSpeed*delta;
    followerPos.z+=(followerTargetPos.z-followerPos.z)*followSpeed*delta;
    const col=resolveCollision(followerPos.x,followerPos.z,0.35);
    followerPos.x=col.x;followerPos.z=col.z;
    playerModel.position.set(followerPos.x,0,followerPos.z);
    const lx=state.posX-followerPos.x,lz=state.posZ-followerPos.z;
    playerModel.rotation.y=Math.atan2(lx,lz);
    if(state.moving) playerModel.position.y=Math.abs(Math.sin(state.bobTimer*2))*0.15;
    else playerModel.position.y=0;
  }
}
function updateCamera(delta){
  const eyeHeight=CONFIG.PLAYER_EYE_HEIGHT-(CONFIG.PLAYER_EYE_HEIGHT-CONFIG.CROUCH_EYE_HEIGHT)*state.crouchAmount;
  let bob=0;if(state.headBob&&state.moving)bob=Math.sin(state.bobTimer)*(state.sprinting?.055:.03);
  let shake=0;if(state.camShake&&state.sprinting){state.breatheTimer+=delta*14;shake=Math.sin(state.breatheTimer)*.01;}
  camera.position.set(state.posX,eyeHeight+bob+shake,state.posZ);
  camera.rotation.set(state.pitch+state.recoilPitch,state.yaw,0);
}
function updateFlashlight(delta){if(state.flashlightOn&&state.battery>0){state.battery=Math.max(0,state.battery-CONFIG.BATTERY_DRAIN*delta);window.flashSpot.intensity=state.battery<15?(Math.random()<.3?0:1.6):1.6;if(state.battery<=0)state.flashlightOn=false;}else window.flashSpot.intensity=0;}
function updateCeilingLights(delta){for(const cl of ceilingLights){const dist=Math.hypot(cl.worldX-state.posX,cl.worldZ-state.posZ);const falloff=Math.max(0,1-Math.pow(Math.min(1,dist/CONFIG.LIGHT_FALLOFF_RANGE),1.6));if(falloff<=.015){cl.light.visible=false;continue;}cl.light.visible=true;cl.flickerTimer-=delta;if(cl.flickerTimer<=0){if(cl.flickerMode==="steady"){if(Math.random()<.35){const pulses=2+((Math.random()*4)|0);cl.episode=[];for(let i=0;i<pulses;i++)cl.episode.push({dur:.04+Math.random()*.16,val:Math.random()<.5?0:.3});cl.episode.push({dur:.2,val:1});cl.flickerMode="flicker";cl.episodeIdx=0;cl.flickerTimer=cl.episode[0].dur;}else cl.flickerTimer=1.5+Math.random()*5.5;}else{cl.episodeIdx++;if(!cl.episode||cl.episodeIdx>=cl.episode.length){cl.flickerMode="steady";cl.flickerTimer=2+Math.random()*7;}else cl.flickerTimer=cl.episode[cl.episodeIdx].dur;}}let factor=cl.flickerMode==="flicker"&&cl.episode?cl.episode[cl.episodeIdx].val:.94+Math.random()*.06;cl.light.intensity=cl.base*factor*falloff;}}
function updateDetective(delta){if(!detective)return;detective.breathe+=delta*1.5;detective.group.scale.y=1+Math.sin(detective.breathe)*.01;}
function updateGate(delta){if(gateLight)gateLight.intensity=1.4+Math.sin(performance.now()*.002)*.3;if(gateMesh)gateMesh.rotation.y+=delta*.05;}
function checkDeath(){if(state.hp<=0&&!state.gameOver){state.gameOver=true;state.running=false;document.getElementById("deathScreen").style.display="flex";}}
function triggerWin(){state.win=true;state.running=false;playDoorGate();document.getElementById("winScreen").style.display="flex";}
let saveAccum=0;
function gameLoop(){if(!state.running){if(!state.gameOver&&!state.win)requestAnimationFrame(gameLoop);return;}requestAnimationFrame(gameLoop);const delta=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(delta);if(!state.paused){updateMovement(delta);updateCamera(delta);updateWeapon(delta);updateFlashlight(delta);updateCeilingLights(delta);updateDetective(delta);updateGate(delta);for(const t of state.targets)updateEntity(t,delta);checkDeath();}updateHUD();drawMinimap();saveAccum+=delta;if(saveAccum>8){saveAccum=0;saveGame();}renderer.render(scene,camera);}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
function startGame(){document.getElementById("startScreen").style.display="none";document.getElementById("game").style.display="block";document.getElementById("backButton").style.display="block";if(!scene)buildScene();bindInput();state.running=true;state.paused=false;clock.getDelta();gameLoop();}
function backToMenu(){state.running=false;document.getElementById("game").style.display="none";document.getElementById("startScreen").style.display="flex";}
document.getElementById("startButton").addEventListener("click",startGame);
document.getElementById("backButton").addEventListener("click",backToMenu);
document.getElementById("settingsButton").addEventListener("click",()=>document.getElementById("settingsModal").style.display="flex");
document.getElementById("howToPlayButton").addEventListener("click",()=>document.getElementById("howToPlayModal").style.display="flex");
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>{document.getElementById(b.dataset.close).style.display="none";if(b.dataset.close==="deathNoteModal")state.paused=false;}));
document.getElementById("deathNoteSubmit").addEventListener("click",submitDeathNote);
document.getElementById("retryBtn1").addEventListener("click",()=>location.reload());
document.getElementById("retryBtn2").addEventListener("click",()=>location.reload());
document.getElementById("menuBtn1").addEventListener("click",()=>location.reload());
document.getElementById("menuBtn2").addEventListener("click",()=>location.reload());
document.getElementById("qualitySelect").addEventListener("change",e=>{applyQuality(e.target.value);saveGame();});
document.getElementById("sensRange").addEventListener("input",e=>{state.sensitivity=parseFloat(e.target.value);saveGame();});
document.getElementById("volRange").addEventListener("input",e=>{state.volume=parseFloat(e.target.value);saveGame();});
document.getElementById("bobToggle").addEventListener("change",e=>{state.headBob=e.target.checked;saveGame();});
document.getElementById("shakeToggle").addEventListener("change",e=>{state.camShake=e.target.checked;saveGame();});
loadSettings();
</script>
